services:
  - type: web
    name: mln-hinh-thai-kinh-te-xa-hoi
    runtime: node
    repo: https://github.com/azizu1012/MLN111_SE1839
    branch: main
    plan: free
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npm run build
    startCommand: cd backend && NODE_ENV=production node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/content
